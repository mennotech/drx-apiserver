# Reference deployment for drx-apiserver.
#
# This compose file is a CONSUMER example: it layers the reference app
# overlay on top of the reusable drx-apiserver base image. The base image
# itself is built via the project Makefile (`make base`) or, in
# production, pulled from the published registry.

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Console UI at http://localhost:9001 ; S3 API on :9000.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backend_minio:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
            sh -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1; do sleep 1; done;
              mc mb -p local/${DRX_S3_BUCKET:-drx-data-local} >/dev/null 2>&1 || true;
             mc version enable local/${DRX_S3_BUCKET:-drx-data-local} >/dev/null 2>&1 || true;
              mc anonymous set download local/${DRX_S3_BUCKET:-drx-data-local}/${DRX_S3_PREFIX_PUBLIC:-public} >/dev/null 2>&1 || true;
             echo 'minio-init: bucket ${DRX_S3_BUCKET:-drx-data-local} ready (versioning enabled; anonymous read on ${DRX_S3_PREFIX_PUBLIC:-public}/)'"
    restart: 'no'

  drx-apiserver:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DRX_BASE_IMAGE:-drx-apiserver:dev}
    image: ${APP_IMAGE:-drx-apiserver-demo:dev}
    depends_on:
      - minio
    ports:
      - "8088:80"
    environment:
      # Site identity
      DRUPAL_ADMIN_USER: ${DRUPAL_ADMIN_USER:-admin}
      DRUPAL_ADMIN_PASS: ${DRUPAL_ADMIN_PASS:?Set DRUPAL_ADMIN_PASS in .env before starting the backend}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-DrX API Server}
      # Storage (SQLite default; override via .env to use Postgres/MySQL)
      DRUPAL_DB_DRIVER: ${DRUPAL_DB_DRIVER:-sqlite}
      DRUPAL_SQLITE_PATH: /var/drupal-db/db.sqlite
      # Public URLs / CORS
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Shared S3 connection (Litestream replica + Drupal file storage).
      # One bucket, three prefixes: litestream/, private/, public/. The
      # base image takes this as the source of truth and bridges into
      # Litestream's native env vars on its own.
      DRX_S3_BUCKET: ${DRX_S3_BUCKET:-drx-data-local}
      DRX_S3_REGION: ${DRX_S3_REGION:-us-east-1}
      DRX_S3_ENDPOINT: ${DRX_S3_ENDPOINT:-http://minio:9000}
      DRX_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      DRX_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DRX_S3_PREFIX_LITESTREAM: ${DRX_S3_PREFIX_LITESTREAM:-litestream}
      DRX_S3_PREFIX_PRIVATE: ${DRX_S3_PREFIX_PRIVATE:-private}
      DRX_S3_PREFIX_PUBLIC: ${DRX_S3_PREFIX_PUBLIC:-public}
    volumes:
      - backend_drupal_files:/var/www/html/web/sites/default/files
      - backend_drupal_db:/var/drupal-db
    restart: unless-stopped

volumes:
  backend_drupal_files:
  backend_drupal_db:
  backend_minio:
  