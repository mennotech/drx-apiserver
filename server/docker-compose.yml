# Reference deployment for drx-apiserver.
#
# This compose file is a CONSUMER example: it layers the reference app
# overlay on top of the reusable drx-apiserver base image. The base image
# itself is built via the project Makefile (`make base`) or, in
# production, pulled from the published registry.

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Console UI at http://localhost:9001 ; S3 API on :9000.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backend_minio:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      sh -c "until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} >/dev/null 2>&1; do sleep 1; done;
             mc mb -p local/${DRX_LITESTREAM_BUCKET:-drx-backups} >/dev/null 2>&1 || true;
             echo 'minio-init: bucket ${DRX_LITESTREAM_BUCKET:-drx-backups} ready'"
    restart: 'no'

  drx-apiserver:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DRX_BASE_IMAGE:-drx-apiserver:dev}
    image: ${APP_IMAGE:-drx-apiserver-demo:dev}
    depends_on:
      - minio
    ports:
      - "8088:80"
    environment:
      # Site identity
      DRUPAL_ADMIN_USER: ${DRUPAL_ADMIN_USER:-admin}
      DRUPAL_ADMIN_PASS: ${DRUPAL_ADMIN_PASS:?Set DRUPAL_ADMIN_PASS in .env before starting the backend}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-DrX API Server}
      # Storage (SQLite default; override via .env to use Postgres/MySQL)
      DRUPAL_DB_DRIVER: ${DRUPAL_DB_DRIVER:-sqlite}
      DRUPAL_SQLITE_PATH: /var/drupal-db/db.sqlite
      # Public URLs / CORS
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # API policy: this reference app opts into JSON:API write mode via
      # its post-config-import.d hook; the base image stays read-only.
      #
      # Litestream — enabled by default in this local dev overlay so the
      # drx_litestream admin module shows live data against the sidecar
      # MinIO. In production, leave these unset (DRX_LITESTREAM_ENABLED=0)
      # or point at your real S3-compatible backend.
      DRX_LITESTREAM_ENABLED: ${DRX_LITESTREAM_ENABLED:-1}
      DRX_LITESTREAM_REPLICA_URL: ${DRX_LITESTREAM_REPLICA_URL:-s3://drx-backups/server}
      DRX_LITESTREAM_ENDPOINT: ${DRX_LITESTREAM_ENDPOINT:-http://minio:9000}
      DRX_LITESTREAM_REGION: ${DRX_LITESTREAM_REGION:-us-east-1}
      LITESTREAM_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LITESTREAM_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - backend_drupal_files:/var/www/html/web/sites/default/files
      - backend_drupal_db:/var/drupal-db
    restart: unless-stopped

volumes:
  backend_drupal_files:
  backend_drupal_db:
  backend_minio:
  