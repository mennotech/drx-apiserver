drx_litestream.health:
  path: '/admin/config/drx/litestream'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\HealthController::overview'
    _title: 'DrX Litestream'
  requirements:
    _permission: 'administer drx litestream'

drx_litestream.refresh_remote_size:
  path: '/admin/config/drx/litestream/refresh-remote-size'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\HealthController::refreshRemoteSize'
    _title: 'Refresh remote backup size'
  requirements:
    _permission: 'administer drx litestream'
    _csrf_token: 'TRUE'

drx_litestream.markers:
  path: '/admin/config/drx/litestream/markers'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\MarkerController::listPage'
    _title: 'Point-in-time markers'
  requirements:
    _permission: 'administer drx litestream'

drx_litestream.marker_add:
  path: '/admin/config/drx/litestream/markers/add'
  defaults:
    _form: '\Drupal\drx_litestream\Form\MarkerForm'
    _title: 'Capture marker'
  requirements:
    _permission: 'administer drx litestream'

drx_litestream.snapshot_add:
  path: '/admin/config/drx/litestream/markers/snapshot'
  defaults:
    _form: '\Drupal\drx_litestream\Form\SnapshotForm'
    _title: 'Capture consistent snapshot'
  requirements:
    _permission: 'administer drx litestream'

drx_litestream.marker_view:
  path: '/admin/config/drx/litestream/markers/{id}'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\MarkerController::view'
    _title: 'Marker JSON'
  requirements:
    _permission: 'administer drx litestream'
    id: \d+

drx_litestream.marker_export:
  path: '/admin/config/drx/litestream/markers/{id}/export'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\MarkerController::export'
    _title: 'Export marker'
  requirements:
    _permission: 'administer drx litestream'
    id: \d+

drx_litestream.marker_delete:
  path: '/admin/config/drx/litestream/markers/{id}/delete'
  defaults:
    _form: '\Drupal\drx_litestream\Form\MarkerDeleteForm'
    _title: 'Delete marker'
  requirements:
    _permission: 'administer drx litestream'
    id: \d+

# ── External HTTP API ─────────────────────────────────────────────────────────
# Gated by DRX_LITESTREAM_API_TOKEN Bearer auth (see ApiTokenAccessCheck).
# Intended for external monitoring (Zabbix, Uptime Kuma) and snapshot
# orchestration (K8s CronJob, CI pipelines, webhooks).
# The _drx_litestream_api_token requirement key is unique to this module
# so the checker does not interfere with other modules' _custom_access usage.

drx_litestream.api_status:
  path: '/drx-litestream/v1/status'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\ApiController::status'
    _title: 'Litestream API: status'
  requirements:
    _drx_litestream_api_token: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

drx_litestream.api_snapshot:
  path: '/drx-litestream/v1/snapshot'
  defaults:
    _controller: '\Drupal\drx_litestream\Controller\ApiController::snapshot'
    _title: 'Litestream API: snapshot'
  requirements:
    _drx_litestream_api_token: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE
