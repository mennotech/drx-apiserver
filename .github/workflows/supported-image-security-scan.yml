name: supported-image-security-scan

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write
  actions: read

env:
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/drx-apiserver
  TRIVY_SEVERITY_SARIF: CRITICAL,HIGH
  TRIVY_SEVERITY_JSON: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

jobs:
  resolve-targets:
    name: Resolve supported image targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest patch in current + previous minor
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/resolve-supported-scan-targets.sh

      - name: Upload target resolution artifact
        uses: actions/upload-artifact@v4
        with:
          name: supported-scan-targets
          path: supported-scan-targets.json
          retention-days: 30

  scan-supported-images:
    name: Scan ${{ matrix.artifact_name }}
    needs: resolve-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy SARIF scan (non-gating)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.digest_ref }}
          format: sarif
          output: trivy-${{ matrix.artifact_name }}.sarif
          severity: ${{ env.TRIVY_SEVERITY_SARIF }}
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'
          hide-progress: true

      - name: Trivy JSON scan (non-gating)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.digest_ref }}
          format: json
          output: trivy-${{ matrix.artifact_name }}.json
          severity: ${{ env.TRIVY_SEVERITY_JSON }}
          ignore-unfixed: true
          exit-code: '0'
          hide-progress: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.artifact_name }}.sarif
          category: ${{ matrix.category }}

      - name: Write scan metadata
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          MATRIX_DIGEST_REF: ${{ matrix.digest_ref }}
          MATRIX_DIGEST: ${{ matrix.digest }}
          MATRIX_IMAGE_TAGS_JSON: ${{ toJSON(matrix.image_tags) }}
          MATRIX_RELEASE_TAGS_JSON: ${{ toJSON(matrix.release_tags) }}
          MATRIX_SUPPORT_LINES_JSON: ${{ toJSON(matrix.support_lines) }}
          MATRIX_CATEGORY: ${{ matrix.category }}
        run: ./.github/scripts/write-trivy-scan-metadata.sh

      - name: Summarize findings
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          MATRIX_DIGEST_REF: ${{ matrix.digest_ref }}
          MATRIX_IMAGE_TAGS_JSON: ${{ toJSON(matrix.image_tags) }}
          MATRIX_RELEASE_TAGS_JSON: ${{ toJSON(matrix.release_tags) }}
          MATRIX_SUPPORT_LINES_JSON: ${{ toJSON(matrix.support_lines) }}
          MATRIX_CATEGORY: ${{ matrix.category }}
          SARIF_SEVERITY_SCOPE: ${{ env.TRIVY_SEVERITY_SARIF }}
          JSON_SEVERITY_SCOPE: ${{ env.TRIVY_SEVERITY_JSON }}
        run: ./.github/scripts/summarize-trivy-findings.sh

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.artifact_name }}
          path: |
            trivy-${{ matrix.artifact_name }}.sarif
            trivy-${{ matrix.artifact_name }}.json
            trivy-${{ matrix.artifact_name }}-metadata.json
          retention-days: 30