name: shell-lint

on:
  push:
    paths:
      - 'base/**/*.sh'
      - 'server/**/*.sh'
      - '.github/**/*.sh'
      - 'Makefile'
      - '.github/workflows/shell-lint.yml'
  pull_request:
    paths:
      - 'base/**/*.sh'
      - 'server/**/*.sh'
      - '.github/**/*.sh'
      - 'Makefile'
      - '.github/workflows/shell-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shell lint
        run: make lint-shell

      - name: Run shell documentation lint
        run: make lint-shell-docs
